[mcp]
safe_mode = true

[llm]
# Used only when the in-Max chat is opt-in enabled (MCP_ENABLE_CHAT=1).
# The chat targets Anthropic's Messages API directly; there is no
# OpenAI / OpenRouter fallback.
#
# api_key belongs in %LOCALAPPDATA%\3dsmax-mcp\.env (ANTHROPIC_API_KEY=...)
# or a real env var, not here.
base_url = https://api.anthropic.com
model = claude-sonnet-4-6
max_tokens = 4096
temperature = 0.7

# Token controls for the in-Max standalone chat.
# prompt_mode: compact (default), full, none
# tool_profile: full (default), core
prompt_mode = compact
tool_profile = full
include_scene_snapshot = true
max_scene_roots = 25
max_prompt_chars = 12000
max_tool_result_chars = 12000
max_history_tool_chars = 1800
max_tool_summary_chars = 600
max_display_tool_chars = 600
max_tool_loops = 4
